stages:
  download:
    cmd: python -m src.data.download
    params:
      - data.bitext_url
    outs:
      - data/raw/bitext.csv

  prepare:
    cmd: python -m src.data.prepare
    deps:
      - src/data/prepare.py
      - src/data/cleaning.py
      - data/raw/bitext.csv
      - data/raw/policies
    params:
      - seed
      - prepare
    outs:
      - data/processed/documents.jsonl

  chunk:
    cmd: python -m src.data.chunk
    deps:
      - src/data/chunk.py
      - src/data/chunking.py
      - data/processed/documents.jsonl
    params:
      - chunking
    outs:
      - data/processed/chunks.jsonl

  make_eval:
    cmd: python -m src.data.make_eval
    deps:
      - src/data/make_eval.py
      - data/raw/bitext.csv
      - data/eval/out_of_scope.txt
    params:
      - seed
      - eval
    outs:
      - data/eval/questions.jsonl

  build_index:
    cmd: python -m src.rag.build_index
    deps:
      - src/rag/build_index.py
      - src/rag/embeddings.py
      - src/rag/index.py
      - data/processed/chunks.jsonl
    params:
      - embeddings
    outs:
      - artifacts/index

  evaluate_retrieval:
    cmd: python -m src.evaluation.run_experiments
    deps:
      - src/evaluation/run_experiments.py
      - src/evaluation/retrieval.py
      - src/data/chunking.py
      - src/rag/embeddings.py
      - src/rag/index.py
      - data/processed/documents.jsonl
      - data/eval/questions.jsonl
    params:
      - experiments
      - embeddings
      - retrieval
      - eval.ks
    metrics:
      - reports/retrieval_metrics.json:
          cache: false

  evaluate_generation:
    # Appelle réellement Groq (~85 appels, 1 à 3 min). Relancé seulement si le prompt,
    # le code RAG, l'index, les questions ou les paramètres de génération changent.
    cmd: python -m src.evaluation.generation
    deps:
      - src/evaluation/generation.py
      - src/rag/prompt.py
      - src/rag/pipeline.py
      - src/rag/translation.py
      - src/rag/generator.py
      - data/eval/generation_questions.jsonl
      - artifacts/index
    params:
      - retrieval
      - generation
      - generation_eval
    metrics:
      - reports/generation_metrics.json:
          cache: false
    outs:
      - reports/generation_details.jsonl:
          cache: false

  quality_gates:
    # Échoue (et arrête dvc repro) si un critère de quality_gates.yaml n'est pas respecté.
    cmd: python -m src.quality.gates
    deps:
      - src/quality/gates.py
      - quality_gates.yaml
      - reports/retrieval_metrics.json
      - reports/generation_metrics.json
      - data/processed/documents.jsonl
      - data/processed/chunks.jsonl
      - data/eval/questions.jsonl
    params:
      - chunking
      - embeddings
      - retrieval.min_score
    metrics:
      - reports/quality_gates.json:
          cache: false
