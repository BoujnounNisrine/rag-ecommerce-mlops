[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Gabarit HTML/SVG : couper les balises nuirait à la lisibilité.
"src/monitoring/dashboard.py" = ["E501"]
"src/app/chat_ui.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
