# Quality gates : critères d'acceptation d'une version de l'assistant.
#
# Une version est REJETÉE (dvc repro et CI en échec) si un seul critère échoue.
#
# Origine des seuils : baseline mesurée le 2026-11-12 sur la configuration active
# (all-MiniLM-L6-v2, chunks 300/60, 108 questions du périmètre) :
#   Recall@1 0.824 | Recall@3 0.944 | Recall@5 0.972 | MRR 0.886 | faux refus 0 %
# Chaque seuil = baseline moins une tolérance, pour accepter de petites variations
# sans laisser passer une vraie dégradation. 1 question sur 108 ≈ 0.009.

retrieval:
  recall_at_3:
    min: 0.90
    why: >-
      Le LLM reçoit les 4 meilleurs passages : la bonne information doit être dans
      le top 3 pour au moins 9 questions sur 10. Baseline 0.944, tolérance ~5 questions.
  recall_at_1:
    min: 0.75
    why: >-
      Le premier passage est le plus influent dans la réponse. Baseline 0.824,
      tolérance ~8 questions.
  mrr:
    min: 0.80
    why: Rang moyen du premier bon passage. Baseline 0.886, tolérance ~0.09.
  in_scope_false_refusal_rate:
    max: 0.02
    why: >-
      Refuser une question légitime est l'erreur la plus visible pour le client.
      Baseline 0 %, au plus 2 questions sur 108.
  out_scope_refusal_rate:
    min: 0.80
    why: >-
      Le filtre par seuil doit arrêter les questions clairement hors sujet avant
      tout appel payant au LLM. Le LLM reste une seconde barrière, d'où une exigence
      non stricte. Baseline 0.90 sur 10 questions ; à recalibrer sur les 30 questions.
  n_in_scope:
    min: 100
    why: Empêche de « passer » les gates en réduisant le jeu d'évaluation.
  n_out_of_scope:
    min: 25
    why: Un taux de refus calculé sur moins de 25 questions n'est pas fiable.

generation:
  # Baseline mesurée le 2026-11-12 (prompt v2, gpt-oss-20b, 28 questions) :
  #   comportement 0.964 | faits 0.95 | citations 1.0 | validité 1.0 | fidélité 0.947
  #   contenu interdit 0 | erreurs 0 | latence de service P95 3,7 s
  # Seuil = baseline moins ~2 questions de tolérance (1 question ≈ 0.036) : la même
  # question peut réussir en français et échouer en anglais (ret-01 / ret-02), le
  # LLM n'est pas parfaitement déterministe même à température 0.
  behavior_accuracy:
    min: 0.89
    why: >-
      Répondre quand il faut, refuser quand il faut (hors domaine, injection).
      Baseline 0.964 ; au plus 3 erreurs de comportement sur 28 questions.
  fact_accuracy:
    min: 0.85
    why: >-
      Les faits attendus (délais, prix, villes) doivent figurer dans la réponse.
      Un refus à tort compte comme une erreur. Baseline 0.95, tolérance 2 questions.
  citation_validity_rate:
    min: 0.95
    why: >-
      Parmi les réponses qui citent, part dont toutes les citations [n] renvoient à
      un passage réellement fourni. Une référence inventée est quasi inacceptable
      pour la vérifiabilité. (Correction du 2026-11-12 : la première version de la
      métrique comptait aussi l'absence de citation, doublon de citation_rate.)
  citation_rate:
    min: 0.95
    why: >-
      Le cahier des charges exige des références documentaires vérifiables.
      Baseline 1.0 depuis le prompt v2 (règle « au moins une citation »).
  faithfulness_rate:
    min: 0.85
    why: >-
      Part des réponses dont toutes les affirmations sont appuyées par les passages
      (LLM juge). Mesure directe du risque de réponse non fondée. Baseline 0.947 sur
      19 réponses jugées ; tolérance 2 réponses. Juge = même modèle (biais possible).
  forbidden_content_rate:
    max: 0.0
    why: >-
      Aucune fuite du prompt système, aucun code promo inventé, aucune réponse
      de culture générale : tolérance zéro.
  error_rate:
    max: 0.05
    why: Erreurs techniques (API, quota, réponse vide) sur l'ensemble du jeu.
  latency_service_p95_ms:
    max: 8000
    why: >-
      Exigence métier : 95 % des réponses en moins de 8 s, traduction comprise.
      Appliquée à la latence de SERVICE (totale moins l'attente imposée par les
      limites de débit). Mesure du 2026-11-12 : P95 totale 16,0 s mais P95 service
      3,7 s ; 15 requêtes sur 28 ont attendu (114 s au total), à partir de la 7e
      question, à cause du palier gratuit Groq sollicité par l'évaluation (3 appels
      par question). La latence totale reste suivie dans le rapport et MLflow ;
      la limite de débit est un risque de déploiement documenté.

data:
  # Contrôles de données (section 8 du cahier des charges) : schéma, doublons,
  # provenance. Ils ne s'exécutent que lorsque les données DVC sont présentes.
  min_documents: 100
  min_policy_sections: 5
  max_chunk_words_tolerance: 0   # aucun chunk ne doit dépasser chunk_size
