# Configuration centrale du projet — versionnée avec Git, suivie par DVC.
# Toute modification ici invalide les étapes DVC concernées.

seed: 42

data:
  bitext_url: "https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset/resolve/main/Bitext_Sample_Customer_Support_Training_Dataset_27K_responses-v11.csv"
  raw_bitext: data/raw/bitext.csv
  policies_dir: data/raw/policies
  documents: data/processed/documents.jsonl
  chunks: data/processed/chunks.jsonl
  eval_questions: data/eval/questions.jsonl
  out_of_scope: data/eval/out_of_scope.txt
  index_dir: artifacts/index
  retrieval_report: reports/retrieval_metrics.json
  request_log: logs/requests.jsonl
  generation_questions: data/eval/generation_questions.jsonl
  generation_report: reports/generation_metrics.json
  generation_details: reports/generation_details.jsonl

prepare:
  # Nombre de réponses distinctes conservées par intent pour construire le corpus.
  # Bitext contient ~1000 réponses par intent, très redondantes : 5 suffisent.
  responses_per_intent: 5
  min_response_words: 20

chunking:
  # Configuration active = large_chunks, meilleure dans la comparaison MLflow
  # (Recall@1 0.824 vs 0.796, MRR 0.886 vs 0.864, 146 chunks vs 189).
  chunk_size: 300      # en mots
  chunk_overlap: 60    # en mots

experiments:
  - name: small_chunks
    chunk_size: 120
    chunk_overlap: 20
  - name: large_chunks
    chunk_size: 300
    chunk_overlap: 60

embeddings:
  # Petit modèle anglais (~90 Mo), rapide sur CPU, vecteurs de dimension 384.
  # Testé : paraphrase-multilingual-MiniLM-L12-v2 -> moins bon partout
  # (Recall@1 0.787 vs 0.824, hors périmètre refusé 80 % vs 90 %) et échec sur
  # les questions françaises. On garde le modèle anglais + traduction de la requête.
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

retrieval:
  top_k: 4
  # Seuil de refus hors périmètre. Le seuil suggéré pour large_chunks est 0.3645
  # (exactitude équilibrée = 1.0 sur 108 questions du périmètre et 10 hors périmètre).
  # Arrondi à 0.36 pour ne refuser aucune question légitime. Marge faible :
  # à recalibrer avec plus de questions hors périmètre.
  min_score: 0.36
  # Traduit la question en anglais (appel Groq court) avant la recherche, pour
  # pouvoir poser des questions en français sur des documents en anglais.
  translate_query: true

generation:
  # Le nom du modèle Groq est lu dans .env (GROQ_MODEL) pour pouvoir en changer
  # sans modifier le code. Température 0 = réponses reproductibles.
  # 1000 tokens : gpt-oss raisonne avant de répondre, son raisonnement consomme des tokens.
  temperature: 0.0
  max_tokens: 1000
  translation_max_tokens: 300
  # "low" pour les modèles qui raisonnent (gpt-oss) : plus rapide, moins de tokens.
  # Mettre null si GROQ_MODEL désigne un modèle qui ne raisonne pas.
  reasoning_effort: low
  # Prix en USD par million de tokens, pour estimer le coût par requête.
  # Tarifs Groq de openai/gpt-oss-20b, relevés le 2026-11-13 (à revoir si GROQ_MODEL change).
  price_per_million_input: 0.075
  price_per_million_output: 0.30

generation_eval:
  # LLM juge : vérifie que chaque affirmation de la réponse est appuyée par les
  # passages fournis (fidélité). Même modèle que l'assistant : biais possible
  # d'auto-évaluation, à mentionner dans le rapport.
  use_judge: true
  # Pause entre deux questions pour rester sous la limite de débit de Groq.
  sleep_seconds: 1.0

eval:
  # Questions tirées de la colonne `instruction`, stratifiées par intent.
  questions_per_intent: 4
  ks: [1, 3, 5]

monitoring:
  # Tableau de bord : python -m src.monitoring.dashboard (lit logs/requests.jsonl).
  # Les N requêtes les plus récentes sont comparées aux N précédentes pour
  # détecter une dérive des entrées (scores de retrieval, longueur des questions).
  window: 40
  alerts:
    error_rate_max: 0.05            # même seuil que la quality gate error_rate
    latency_service_p95_max_ms: 8000  # même exigence métier que la quality gate
    rate_limit_share_max: 0.20      # part des requêtes ralenties par la limite de débit
    translation_fallback_max: 0.05  # traductions échouées (recherche en langue d'origine)
    top_score_drop_max: 0.10        # baisse du score moyen de retrieval (dérive)
    question_length_change_max: 0.50  # variation relative de la longueur moyenne
